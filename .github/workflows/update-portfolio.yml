name: update portfolio

on:
  schedule:
    # 06:00 and 18:00 UTC — 11:30 and 23:30 IST.
    - cron: "0 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_portfolio.py
      - .github/workflows/update-portfolio.yml

permissions:
  contents: write

concurrency:
  group: update-portfolio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rewrite the live sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_portfolio.py

      - name: Commit if anything moved
        run: |
          if git diff --quiet -- README.md; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "portfolio: refresh live sections"
          git push
